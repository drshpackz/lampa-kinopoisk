# Пример nginx для kp-proxy. Сервер слушает только 127.0.0.1:8787, наружу его
# выставляет nginx с TLS. Замените kp.example.com на свой домен и выпустите
# сертификат (certbot --nginx -d kp.example.com).
#
# lampa.mx открывается по http, поэтому браузер пустит и http-адрес сервера,
# но с https ничего не ломается и трафик не читается по дороге.

# Адрес публичный, а ключи на сервере — ограничиваем частоту с одного IP,
# чтобы чужой скрипт не мог перебором новых тайтлов сжечь суточный лимит.
# (limit_req_zone живёт в контексте http; файлы из sites-enabled подключаются
# именно туда, так что объявлять её здесь можно.)
limit_req_zone $binary_remote_addr zone=kpproxy:1m rate=5r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kp.example.com;

    ssl_certificate     /etc/letsencrypt/live/kp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kp.example.com/privkey.pem;

    location / {
        limit_req zone=kpproxy burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name kp.example.com;
    return 301 https://$host$request_uri;
}
